<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Open, edit and save Excel spreadsheets in the browser." />
    <meta property="og:title" content="Doan Excelsior" />
    <meta property="og:image" content="/logo.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/icon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Public+Sans:wght@400;600&display=swap"
    />
    <title>Doan Excelsior</title>
    <!-- Apply the saved theme before first paint so there is no flash. -->
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('doan-excelsior-theme')
          if (['light', 'dark', 'knight'].includes(theme)) document.documentElement.dataset.theme = theme
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
